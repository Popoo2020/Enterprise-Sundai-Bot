name: OWASP ZAP baseline

on:
  schedule:
    - cron: "43 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scan the public website
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: https://sundaibot.com
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline-report
          cmd_options: -a -m 3
