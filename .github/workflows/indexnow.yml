name: Submit updated pages to IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build IndexNow payload from all sitemaps
        run: |
          python - <<'PY'
          import glob
          import json
          import xml.etree.ElementTree as ET

          ns = {'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = []
          sitemap_files = sorted(glob.glob('site/sitemap*.xml'))
          if not sitemap_files:
              raise SystemExit('No sitemap XML files found')

          for sitemap in sitemap_files:
              tree = ET.parse(sitemap)
              urls.extend(n.text for n in tree.findall('.//s:loc', ns) if n.text)

          # Preserve sitemap order while removing duplicate URLs.
          urls = list(dict.fromkeys(urls))
          payload = {
            'host': 'sundaibot.com',
            'key': '7f4e8d2c1b9a46f8a35d0c6e91b2f740',
            'keyLocation': 'https://sundaibot.com/7f4e8d2c1b9a46f8a35d0c6e91b2f740.txt',
            'urlList': urls
          }
          with open('/tmp/indexnow.json','w') as f:
            json.dump(payload, f)
          print(f'Prepared {len(urls)} unique URLs from {len(sitemap_files)} sitemap files')
          PY
      - name: Notify IndexNow
        run: |
          curl --fail-with-body --retry 3 --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json \
            https://api.indexnow.org/indexnow
